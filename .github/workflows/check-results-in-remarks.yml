# Flags a remark div (#rem-) that a PR edits that displays an equation and states a claim. A result belongs in a #thm-, #lem-, #cor- or #prp- div. <!-- check-results-in-remarks: allow --> exempts one.
# Warn-only heuristic: reports findings as annotations and does not fail the run.
# No push trigger: a push run has no base to diff against.
# A manual run scans the whole tree.
name: Check results in remarks

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-results-in-remarks.yml@v3
    with:
      fail: false
      whole-tree: ${{ github.event_name == 'workflow_dispatch' }}
      paths-ignore: '_extensions/**,**/outtakes/**,latex-macros/**'
