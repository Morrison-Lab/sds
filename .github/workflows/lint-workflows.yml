# Thin caller of Morrison-Lab/gha's reusable workflow linter: actionlint
# (syntax, expression semantics, shellcheck over `run:` blocks) plus zizmor
# (security). Ported from Morrison-Lab/lds.
#
# Warn-only for now (`fail: false`), unlike lds, where it blocks: zizmor
# reports findings against the workflows already here (`dangerous-triggers`
# on preview-deploy.yml, `artipacked` on four checkouts, `unpinned-images` in
# check-spelling). Switch to `fail: true` once
# those are fixed or ignored with a reason. `.github/zizmor.yml` accepts tag
# pins (and `.github/dependabot.yml` keeps them current) while still flagging
# a branch pin such as `@main`.
name: Lint Workflows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/lint-workflows.yml@v3
    with:
      fail: false
