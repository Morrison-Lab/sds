# Thin caller of Morrison-Lab/gha's reusable workflow linter: actionlint
# (syntax, expression semantics, shellcheck over `run:` blocks) plus zizmor
# (security). Ported from Morrison-Lab/lds.
#
# Blocking, because both tools report zero findings against this repo's
# workflows as of this file's introduction, so a new finding means a new
# problem rather than a backlog. `.github/zizmor.yml` accepts tag pins (and
# `.github/dependabot.yml` keeps them current). That policy does not tell a tag
# from a branch, so a pin such as `@main` passes and is left to code review.
# `.github/actionlint.yaml` ignores the `models` permission scope that
# `summary.yml` needs, which actionlint does not know yet (without the file,
# actionlint reports it).
name: Lint Workflows

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/lint-workflows.yml@v3
