# Flags a contrast in a definition, remark or note that a PR adds and that cites
# no source ("X, not Y" must say who holds the other reading).
# Fails the run on a finding: checks fail rather than warn (Ezra).
# No push trigger: a push run has no base to diff against and would report
# success having checked nothing. A manual run scans the whole tree.
name: Check unexplained contrasts

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-unexplained-contrasts.yml@v3
    with:
      fail: true
      whole-tree: ${{ github.event_name == 'workflow_dispatch' }}
      paths-ignore: '_extensions/**,**/outtakes/**,latex-macros/**'
