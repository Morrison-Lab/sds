# Thin caller of Morrison-Lab/gha's reusable changed-lines linter.
# Lints the R chunks of the .R, .Rmd and .qmd lines a PR adds or edits with the
# lab's lms linters, including the no-nested-calls rules, and leaves the
# untouched lines of a file alone.
name: Lint changed lines

on:
  pull_request:

jobs:
  lint:
    permissions:
      contents: read
      pull-requests: read
    uses: Morrison-Lab/gha/.github/workflows/lint-changed-lines.yml@v3
    with:
      file-pattern: '[.]([Rr]|[Rr]md|[Qq]md)$'
      lms-ref: db62d0af4b618da4691ffa5d97d2656c4b286dd9
