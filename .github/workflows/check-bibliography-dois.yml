name: Check Bibliography DOIs

# Thin caller for the shared reusable workflow in Morrison-Lab/gha.
# The reusable workflow (and its bundled composite) reproduce the previous
# standalone behavior: scan every *.bib in the repo and validate each DOI
# resolves and matches its CrossRef metadata.
# See https://github.com/Morrison-Lab/gha for inputs and versioning.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Keep the job id (check-dois) matching the previous standalone workflow so
  # the status-check context name doesn't change. Re-declare the least-privilege
  # token the standalone job had; the reusable workflow only needs contents:read.
  check-dois:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-bibliography-dois.yml@v3
    with:
      # Book/article entries copied from rme's references.bib without a DOI
      # (older or non-DOI'd books, a web textbook, and an eScholarship paper),
      # Holm (1979), a JSTOR-only article with no DOI,
      # Phipson and Smyth (2010) and Cramer (1946), whose valid DOIs answer
      # the checker with HTTP 202 (De Gruyter's bot filter) on every run,
      # Akaike (1974), whose valid IEEE DOI answers 202 on every run too,
      # Rao (1945), a bulletin article with no DOI,
      # Rice (2007), a Cengage textbook with no DOI,
      # and Rothman et al. (2021), Modern Epidemiology, a Wolters Kluwer
      # textbook with no DOI (only an ISBN),
      # and Hoffman and Gelman (2014), a JMLR article, which assigns no DOIs.
      # Move a key out of this list when a DOI is found and verified
      # against CrossRef.
      exclude-keys: >-
        aragon2018population box_draper_1987 CaseBerg01 hosmer1989applied
        HobbsN.Thompson2015Bmas hoggtanis2015
        kery-bayes-pop kleinbaum2014applied korner.bayes.ecology rossbayes
        statrethink2e van2018flexible geron2017hands holm1979simple
        phipson2010permutation rao1945information cramer1946mathematical
        rice2007mathematical akaike1974new me4 hoffman2014nuts
