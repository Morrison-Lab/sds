# Renders the site and deploys it to the gh-pages branch (which GitHub Pages
# serves), keeping the pr-preview/ subtree.
#
# Do NOT name a `concurrency:` group `gh-pages` in this caller (deadlock,
# https://github.com/Morrison-Lab/gha/issues/809).
name: Quarto Publish

on:
  workflow_dispatch:
  push:
    branches: main

# Serialize deploys; `cancel-in-progress: false` so a half-written deploy
# finishes rather than being killed part-way.
concurrency:
  group: quarto-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write
    uses: Morrison-Lab/gha/.github/workflows/quarto-publish.yml@v3
    with:
      setup-r: true
      r-packages: |
        deps::.
        any::knitr
        any::rmarkdown
        any::tibble
      tinytex: true
      # rjags (a DESCRIPTION import) links against the JAGS system library,
      # which the Bayesian inference page's MCMC examples run.
      apt-packages: 'jags'
      # One bare `quarto render` of every declared format, as before.
      formats: ''
      timezone: America/Los_Angeles
      freeze-cache: true
      # A render that times out still saves the pages it executed, so a re-run
      # resumes from them instead of starting over.
      freeze-cache-save-on-failure: true
      # The default 45 minutes is a hang ceiling. A full render of this site
      # takes 12 to 47 minutes, depending on the freeze cache and the runner.
      timeout-minutes: 90
      checkout-submodules: true
