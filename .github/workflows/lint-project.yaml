# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint-project.yaml

permissions: read-all

jobs:
  lint-project:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # `sds` is a self-referential symlink (`sds -> .`, see CLAUDE.md) that
      # lets include paths written as `sds/...` resolve when this repo
      # renders standalone. lintr's own directory walk follows symlinks and
      # has no config-level way to exclude it without also excluding the
      # real files it aliases (normalize_path() collapses the two onto the
      # same path -- see .lintr.R). Remove it before linting so lintr never
      # walks into it; nothing under it is content distinct from what's
      # already linted at the repo root, and this job never renders the site.
      - name: Remove self-referential sds symlink before linting
        run: rm -f sds

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install lintr and dependencies
        run: install.packages(c("lintr", "withr"), repos = "https://packagemanager.posit.co/cran/__linux__/noble/latest")
        shell: Rscript {0}

      - name: Lint root directory
        run: lintr::lint_dir()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
