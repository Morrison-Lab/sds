# Thin caller of Morrison-Lab/gha's reusable gitleaks history scan.
# Ported from Morrison-Lab/lds.
#
# History rather than the diff: a secret committed and later removed is still
# exposed, because the orphaned commit stays fetchable through the GitHub API.
#
# A pull request scans only the commits it adds, `base..head`, which also
# covers a secret added and removed within the PR. Every push to `main` and
# the weekly run scan the full history of every branch but `gh-pages`: that
# branch holds the rendered site and previews, one commit per deploy, and is
# most of the repository's size. It is built output from `main`, whose source
# the scan covers.
name: Check for secrets

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Mondays, 08:00 UTC.
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-secrets.yml@v2
    with:
      # The SHAs are the PR's own commit ids, not user-supplied text.
      log-opts: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '--full-history --exclude=refs/remotes/origin/gh-pages --all' }}
