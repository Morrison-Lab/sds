# Flags an example div (#exm-) with no figure when a PR adds a line to it.
# Add a figure, or `<!-- no-figure: reason -->` inside the div.
# Warn-only while the existing examples are backfilled.
name: Check example figures

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    uses: Morrison-Lab/gha/.github/workflows/check-exm-figures.yml@v3
    with:
      fail: false
      paths-ignore: '_extensions/**,**/outtakes/**'
